# Put this folder (.streamlit/) in the repo root and run from there:  streamlit run app/app.py
[server]
headless = true
runOnSave = false
fileWatcherType = "none"      # editing a file during the demo will not reload the app
maxUploadSize = 200           # MB

[browser]
gatherUsageStats = false

[theme]
base = "light"                # the dashboard colours are designed for a light page
primaryColor = "#0A5C8A"      # selected filter, focus rings, number steppers: the dashboard blue, not Streamlit red
backgroundColor = "#F2F4F7"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#0F1B2D"

[client]
toolbarMode = "minimal"
